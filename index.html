
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b14">
<title>ROOM WANGI | MLBB</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 22px 15px;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #fff;
  background:
    radial-gradient(ellipse at top, #123e54 0%, transparent 60%),
    #070b14;
}

.container {
  max-width: 440px;
  margin: 15px auto;
}

.header {
  text-align: center;
  padding: 25px 10px;
}

.emblem {
  font-size: 52px;
  filter: drop-shadow(0 0 15px #00d9ff);
}

h1 {
  color: #00eaff;
  font-size: 29px;
  letter-spacing: 2px;
  margin: 12px 0 6px;
  text-shadow: 0 0 15px #00c8ff55;
}

.subtitle {
  color: #8ca8bb;
  font-size: 12px;
  letter-spacing: 2px;
}

.status {
  display: inline-block;
  margin-top: 18px;
  padding: 8px 13px;
  border: 1px solid #00dfaa55;
  background: #00dfaa12;
  border-radius: 30px;
  color: #00f0b5;
  font-size: 11px;
}

.card {
  padding: 22px;
  border-radius: 17px;
  border: 1px solid #244458;
  background: linear-gradient(145deg, #101c2b, #09111c);
  box-shadow: 0 12px 40px #0005;
}

.card-title {
  color: #00eaff;
  font-weight: bold;
  font-size: 15px;
  margin-bottom: 20px;
}

label {
  display: block;
  font-size: 12px;
  color: #c9dce8;
  margin: 17px 0 8px;
}

input, select {
  display: block;
  width: 100%;
  padding: 14px;
  color: white;
  background: #08121f;
  border: 1px solid #294457;
  border-radius: 9px;
  outline: none;
  font-size: 14px;
}

input:focus, select:focus {
  border-color: #00eaff;
  box-shadow: 0 0 8px #00eaff20;
}

select option {
  background: #101c2b;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: 0;
  border-radius: 9px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  color: #031018;
  background: linear-gradient(100deg, #00c8ff, #00f0ac);
  box-shadow: 0 0 18px #00d9ff25;
}

.reset {
  margin-top: 10px;
  background: #132536;
  border: 1px solid #294457;
  color: #d3e9f5;
}

button:active {
  transform: scale(.98);
}

.result {
  display: none;
  margin-top: 18px;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #00eaff40;
  background: #07121e;
  font-size: 12px;
  line-height: 1.9;
  overflow-wrap: anywhere;
}

.result strong {
  color: #00eaff;
}

.footer {
  padding: 18px 8px;
  text-align: center;
  color: #71899b;
  font-size: 10px;
  line-height: 1.8;
}

@media (max-width: 350px) {
  .row {
    grid-template-columns: 1fr;
    gap: 0;
  }

  h1 {
    font-size: 24px;
  }
}
</style>
</head>

<body>
<div class="container">

  <header class="header">
    <div class="emblem">⚔️</div>
    <h1>ROOM WANGI</h1>
    <div class="subtitle">MOBILE LEGENDS BANG BANG</div>
    <div class="status">● PANEL READY</div>
  </header>

  <main class="card">
    <div class="card-title">⚡ KONFIGURASI ROOM</div>

    <form id="roomForm">
      <label for="playerId">ID PLAYER</label>
      <input
        id="playerId"
        type="text"
        inputmode="numeric"
        pattern="[0-9]+"
        maxlength="20"
        placeholder="Masukkan ID akun"
        required
      >

      <label for="zoneId">ZONE ID</label>
      <input
        id="zoneId"
        type="text"
        inputmode="numeric"
        pattern="[0-9]+"
        maxlength="10"
        placeholder="Masukkan Zone ID"
        required
      >

      <label for="server">PILIH SERVER</label>
      <select id="server">
        <option value="Indonesia">Indonesia</option>
        <option value="Singapura">Singapura</option>
        <option value="Malaysia">Malaysia</option>
        <option value="Filipina">Filipina</option>
        <option value="Thailand">Thailand</option>
        <option value="Brasil">Brasil</option>
        <option value="Amerika">Amerika</option>
        <option value="Lainnya">Lainnya</option>
      </select>

      <div class="row">
        <div>
          <label for="mode">MODE GAME</label>
          <select id="mode">
            <option>Classic</option>
            <option>Ranked</option>
            <option>Brawl</option>
            <option>Custom</option>
          </select>
        </div>

        <div>
          <label for="target">TARGET LAWAN</label>
          <select id="target">
            <option value="Bot">Bot</option>
            <option value="Pemain asli">Pemain asli</option>
            <option value="Campuran">Campuran</option>
          </select>
        </div>
      </div>

      <button class="start" type="submit">
        ⚡ MASUK GAME MOBILE LEGENDS
      </button>

      <button class="reset" id="resetBtn" type="button">
        RESET FORM
      </button>
    </form>

    <div class="result" id="result" aria-live="polite"></div>
  </main>

  <footer class="footer">
    ROOM WANGI PRO • UNOFFICIAL FAN PAGE<br>
    Panel ini tidak terhubung ke server MLBB.
    Pilihan server dan target lawan hanya simulasi.
    Gunakan fitur bot resmi di dalam game.
  </footer>
</div>

<script>
const form = document.getElementById("roomForm");
const result = document.getElementById("result");

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const id = document.getElementById("playerId").value.trim();
  const zone = document.getElementById("zoneId").value.trim();
  const server = document.getElementById("server").value;
  const mode = document.getElementById("mode").value;
  const target = document.getElementById("target").value;

  if (!/^\d+$/.test(id) || !/^\d+$/.test(zone)) {
    alert("ID dan Zone ID harus berupa angka!");
    return;
  }

  result.style.display = "block";
  result.replaceChildren();

  const heading = document.createElement("strong");
  heading.textContent = "✓ KONFIGURASI BERHASIL DISIMPAN";
  result.appendChild(heading);

  [
    ["ID Player", id],
    ["Zone ID", zone],
    ["Server pilihan", server],
    ["Mode", mode],
    ["Target lawan", target]
  ].forEach(function(item) {
    const line = document.createElement("div");
    line.textContent = item[0] + ": " + item[1];
    result.appendChild(line);
  });

  const note = document.createElement("div");
  note.style.color = "#9bb4c5";
  note.style.marginTop = "10px";
  note.textContent =
    "Konfigurasi hanya disimpan di halaman ini. " +
    "Membuka game tidak menerapkan pilihan server atau bot.";
  result.appendChild(note);

  // Mencoba membuka aplikasi MLBB.
  window.location.href = "mobilelegends://";
});

document.getElementById("resetBtn").addEventListener("click", function() {
  form.reset();
  result.style.display = "none";
  result.replaceChildren();
});
</script>

</body>
</html>
